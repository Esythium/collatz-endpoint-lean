name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Based on leanprover-community/LeanProject's build workflow.
      # Preserve this project's lean-toolchain and lake-manifest.json.
      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"

      - name: Download the required mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          modules = set()
          for source in pathlib.Path("CollatzEndpoint").rglob("*.lean"):
              modules.update(re.findall(
                  r"^import\s+(Mathlib\.[A-Za-z0-9_.]+)\s*$",
                  source.read_text(encoding="utf-8"), re.MULTILINE))
          if not modules:
              raise SystemExit("No direct mathlib imports found; refusing an empty cache request.")
          print(f"Requesting {len(modules)} direct imports and their dependencies.", flush=True)
          subprocess.run(["lake", "exe", "cache", "get", *sorted(modules)], check=True)
          PY

      - name: Build all project modules
        env:
          LEAN_NUM_THREADS: "2"
        run: lake build

      - name: Check the public theorem axiom allowlist
        run: |
          set -euo pipefail
          lake env lean Audit.lean 2>&1 | tee audit.log
          python3 - <<'PY'
          import pathlib
          import re

          expected = {
              "alpha_unique",
              "parityWord_bijective",
              "dyadic_translation",
              "block_card_le_layerSum",
              "layerSum_le",
              "uniform_window_bound",
              "divergent_iff_injective_orbit",
              "successiveOddOrbit_eq_orbit",
              "divergent_prefixMax_lower",
              "divergent_odd_prefixMax_lower",
              "divergent_not_isBigO",
              "divergent_odd_not_isBigO",
              "eventuallyPeriodic_of_critical_power",
              "eventuallyPeriodic_of_odd_critical_power",
              "divergent_reciprocal_summable",
              "divergent_odd_reciprocal_summable",
              "collatz_product_identity",
              "divergent_correctionProduct_converges",
              "divergent_not_drift_upper",
              "divergent_drift_frequently_gt",
              "divergent_drift_limsup",
          }
          expected = {"CollatzEndpoint." + name for name in expected}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          output = pathlib.Path("audit.log").read_text(encoding="utf-8")
          reports = re.findall(
              r"^'([^']+)' depends on axioms:\s*\[([^\]]*)\]",
              output, re.MULTILINE)
          actual = {name for name, _ in reports}
          if actual != expected or len(reports) != len(expected):
              raise SystemExit(
                  f"Axiom report mismatch: missing={sorted(expected - actual)}, "
                  f"unexpected={sorted(actual - expected)}, reports={len(reports)}")
          for name, axiom_text in reports:
              axioms = {item.strip() for item in axiom_text.split(",") if item.strip()}
              if axioms - allowed:
                  raise SystemExit(f"Disallowed axioms for {name}: {sorted(axioms - allowed)}")
          print(f"All {len(expected)} required theorem reports satisfy the axiom allowlist.")
          PY

      - name: Replay all imports and project declarations in a fresh Lean kernel
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          lake env leanchecker --fresh --verbose CollatzEndpoint 2>&1 | tee kernel-replay.log

      - name: Confirm the pinned configuration was preserved
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
